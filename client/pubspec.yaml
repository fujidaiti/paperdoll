name: paperdoll
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.0
resolution: workspace

dependencies:
  device_info_plus: ^13.2.0
  dio: ^5.9.2
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  flutter_secure_storage: ^10.3.1
  freezed_annotation: ^3.1.0
