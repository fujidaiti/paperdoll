openapi: "3.0.3"
info:
  title: Paperdoll API
  version: "0.1.0"

tags:
  - name: Authentication
    description: Signing up, verifying the email address, and managing sessions.
  - name: Newspapers
    description: The daily newspaper assembled from subscribed feeds.
  - name: Feeds
    description: Feed subscriptions, feed discovery, and feed entries.
  - name: Reading List
    description: Items saved for later, including the archive.
  - name: Web Clips
    description: Web pages captured from a URL.

paths:
  /health:
    $ref: "./paths/health.yaml"
  /newspapers/today:
    $ref: "./paths/newspapers.yaml#/today"
  /feeds:
    $ref: "./paths/feeds.yaml#/collection"
  /feeds/search:
    $ref: "./paths/feeds.yaml#/search"
  /feeds/{id}:
    $ref: "./paths/feeds.yaml#/item"
  /feeds/{id}/timeline:
    $ref: "./paths/feeds.yaml#/timeline"
  /feed-entries/{id}:
    $ref: "./paths/feed-entries.yaml"
  /web-clips/{id}:
    $ref: "./paths/web-clips.yaml"
  /reading-list:
    $ref: "./paths/reading-list.yaml"
  /reading-list/archived:
    $ref: "./paths/reading-list-archived.yaml"
  /reading-list/{id}:
    $ref: "./paths/reading-list-item.yaml"
  /signup:
    $ref: "./paths/auth.yaml#/signup"
  /signup/verify-email:
    $ref: "./paths/auth.yaml#/verifyEmail"
  /signup/resend-verification:
    $ref: "./paths/auth.yaml#/resendVerification"
  /signin:
    $ref: "./paths/auth.yaml#/signin"
  /signout:
    $ref: "./paths/auth.yaml#/signout"

components:
  schemas:
    Feed:
      $ref: "./components/schemas.yaml#/Feed"
    FeedCandidate:
      $ref: "./components/schemas.yaml#/FeedCandidate"
    PostGroup:
      $ref: "./components/schemas.yaml#/PostGroup"
    AttributeCandidate:
      $ref: "./components/schemas.yaml#/AttributeCandidate"
    AttributeValue:
      $ref: "./components/schemas.yaml#/AttributeValue"
    PostSelectors:
      $ref: "./components/schemas.yaml#/PostSelectors"
    FeedEntry:
      $ref: "./components/schemas.yaml#/FeedEntry"
    ReadingListItem:
      $ref: "./components/schemas.yaml#/ReadingListItem"
    Story:
      $ref: "./components/schemas.yaml#/Story"
    Error:
      $ref: "./components/schemas.yaml#/Error"
    AuthToken:
      $ref: "./components/schemas.yaml#/AuthToken"
    SignUpTicket:
      $ref: "./components/schemas.yaml#/SignUpTicket"
  responses:
    BadRequest:
      $ref: "./components/responses.yaml#/BadRequest"
    Unauthorized:
      $ref: "./components/responses.yaml#/Unauthorized"
    NotFound:
      $ref: "./components/responses.yaml#/NotFound"
    Conflict:
      $ref: "./components/responses.yaml#/Conflict"
    TooManyRequests:
      $ref: "./components/responses.yaml#/TooManyRequests"
    InternalServerError:
      $ref: "./components/responses.yaml#/InternalServerError"
