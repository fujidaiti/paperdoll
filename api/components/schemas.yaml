Feed:
  description:
    A web feed, or an unstructured feed, whose `url` and `site_url` are both the
    URL of its page.
  type: object
  required: [id, url, title, subscribed, has_selectors]
  properties:
    id:
      type: integer
    url:
      type: string
      format: uri
    site_url:
      type: string
      format: uri
    icon_url:
      type: string
      format: uri
    title:
      type: string
    description:
      type: string
    subscribed:
      description: Whether the calling user is subscribed to this feed.
      type: boolean
    has_selectors:
      description:
        Whether post selectors are saved for this feed, which only an
        unstructured feed can have.
      type: boolean

FeedCandidate:
  description:
    A feed discovered via search that can be subscribed to (has no local ID yet)
  type: object
  required: [url, title]
  properties:
    url:
      type: string
      format: uri
    site_url:
      type: string
      format: uri
    icon_url:
      type: string
      format: uri
    title:
      type: string
    description:
      type: string

FeedEntry:
  type: object
  required: [id, feed_id, url, title, snapshot_at]
  properties:
    id:
      type: integer
    feed_id:
      type: integer
    url:
      type: string
      format: uri
    title:
      type: string
    description:
      type: string
    content:
      type: string
    published_at:
      type: string
      format: date-time
    snapshot_at:
      type: string
      format: date-time
    read_later:
      allOf:
        - $ref: "#/ReadLater"
      description:
        The reading list item backing this entry, if it is saved in the reading
        list. Absent when the entry is not saved.

ReadLater:
  description:
    The reading list item backing a resource. Present only when the resource is
    saved in the reading list; absent otherwise.
  type: object
  required: [id, archived]
  properties:
    id:
      description: The id of the reading list item.
      type: integer
    archived:
      description: Whether the reading list item is archived.
      type: boolean

ReadingListItem:
  type: object
  required: [id, resource_id, kind, title, saved_at]
  properties:
    id:
      type: integer
    resource_id:
      description:
        The ID of the resource backing this item — the web clip ID for
        `web_clip`, or the feed entry ID for `feed_entry`. Use this to navigate
        directly to the appropriate reader.
      type: integer
    kind:
      description: The kind of the reading list item.
      type: string
      enum: [web_clip, feed_entry]
    title:
      type: string
    description:
      type: string
    saved_at:
      type: string
      format: date-time

Story:
  type: object
  required: [id, resource_id, kind, title]
  properties:
    id:
      type: integer
    resource_id:
      description:
        The ID of the resource backing this story. Use this to navigate directly
        to the appropriate reader.
      type: integer
    kind:
      description: The kind of the resource backing this story.
      type: string
      enum: [web_clip, feed_entry]
    title:
      type: string
    description:
      type: string
    source:
      type: string
    published_at:
      type: string
      format: date-time
    read_later:
      allOf:
        - $ref: "#/ReadLater"
      description:
        The reading list item backing this story, if it is saved in the reading
        list. Absent when the story is not saved.

Error:
  type: object
  required: [message]
  properties:
    message:
      type: string

AuthToken:
  type: object
  required: [token]
  properties:
    token:
      description:
        Opaque bearer token to send in the `Authorization` header on subsequent
        requests.
      type: string

SignUpTicket:
  type: object
  required: [ticket]
  properties:
    ticket:
      description:
        Opaque secret identifying the sign-up attempt the verification code was
        mailed for. Send it back to verify the address or to request another
        code. Valid for 10 minutes.
      type: string

SelectorEditor:
  description: A selector editor of an unstructured feed.
  type: object
  required:
    [
      id,
      expires_at,
      page,
      marked_posts,
      excluded_links,
      excluded_nodes,
      found_posts,
      excluded_posts,
      preview,
    ]
  properties:
    id:
      type: integer
    expires_at:
      type: string
      format: date-time
    page:
      description:
        The simplified page as an HTML document. Each element has its node ID in
        a `data-id` attribute. A plain text has a node ID too, but no attribute.
      type: string
    marked_posts:
      description:
        The marked posts. A new editor starts with the marks that reproduce what
        the saved selectors find.
      type: array
      items:
        $ref: "#/MarkedPost"
    excluded_links:
      description: The excluded links, by host and path.
      type: array
      items:
        type: string
    excluded_nodes:
      description: The excluded nodes, by node ID.
      type: array
      items:
        type: integer
    found_posts:
      $ref: "#/SelectorEditorState/properties/found_posts"
    excluded_posts:
      $ref: "#/SelectorEditorState/properties/excluded_posts"
    preview:
      $ref: "#/SelectorEditorState/properties/preview"

SelectorEditorState:
  description: What the selectors generated from the marks of an editor find.
  type: object
  required: [found_posts, excluded_posts, preview]
  properties:
    found_posts:
      description: The found posts, in document order.
      type: array
      items:
        $ref: "#/FoundPost"
    excluded_posts:
      description: The excluded posts, in document order.
      type: array
      items:
        $ref: "#/ExcludedPost"
    preview:
      description: The posts as the feed will store them.
      type: array
      items:
        $ref: "#/ExtractedPost"

MarkedPost:
  description: A marked post, by the node IDs of its box and its fields.
  type: object
  required: [box, title, link]
  properties:
    box:
      type: integer
    title:
      type: integer
    body:
      type: integer
    link:
      type: integer
    thumbnail:
      type: integer
    pubDate:
      type: integer

FoundPost:
  description:
    A found post, by node IDs as in MarkedPost, with the values of its fields.
  type: object
  required: [box, title, link, values]
  properties:
    box:
      type: integer
    title:
      type: integer
    body:
      type: integer
    link:
      type: integer
    thumbnail:
      type: integer
    pubDate:
      type: integer
    values:
      $ref: "#/ExtractedPost"

ExcludedPost:
  description: An excluded post, by the node ID of its box.
  type: object
  required: [box, link]
  properties:
    box:
      type: integer
    link:
      description: The excluded link that removes the post.
      type: string

ExtractedPost:
  description: The values of the fields of a post.
  type: object
  properties:
    title:
      type: string
    body:
      type: string
    link:
      type: string
    thumbnail:
      type: string
    pubDate:
      type: string
