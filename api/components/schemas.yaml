Feed:
  description:
    A web feed, or an unstructured feed, which is a web page without a feed
    whose posts are extracted with post matchers. The `url` and `site_url` of an
    unstructured feed are both the page's URL.
  type: object
  required: [id, url, title, subscribed, has_matchers]
  properties:
    id:
      type: integer
    url:
      type: string
      format: uri
    site_url:
      type: string
      format: uri
    icon_url:
      type: string
      format: uri
    title:
      type: string
    description:
      type: string
    subscribed:
      description: Whether the calling user is subscribed to this feed.
      type: boolean
    has_matchers:
      description:
        Whether post matchers are saved for this feed. Only an unstructured feed
        can have them.
      type: boolean

FeedCandidate:
  description:
    A feed discovered via search that can be subscribed to (has no local ID yet)
  type: object
  required: [url, title]
  properties:
    url:
      type: string
      format: uri
    site_url:
      type: string
      format: uri
    icon_url:
      type: string
      format: uri
    title:
      type: string
    description:
      type: string

FeedEntry:
  type: object
  required: [id, feed_id, url, title, snapshot_at]
  properties:
    id:
      type: integer
    feed_id:
      type: integer
    url:
      type: string
      format: uri
    title:
      type: string
    description:
      type: string
    content:
      type: string
    published_at:
      type: string
      format: date-time
    snapshot_at:
      type: string
      format: date-time
    read_later:
      allOf:
        - $ref: "#/ReadLater"
      description:
        The reading list item backing this entry, if it is saved in the reading
        list. Absent when the entry is not saved.

ReadLater:
  description:
    The reading list item backing a resource. Present only when the resource is
    saved in the reading list; absent otherwise.
  type: object
  required: [id, archived]
  properties:
    id:
      description: The id of the reading list item.
      type: integer
    archived:
      description: Whether the reading list item is archived.
      type: boolean

ReadingListItem:
  type: object
  required: [id, resource_id, kind, title, saved_at]
  properties:
    id:
      type: integer
    resource_id:
      description:
        The ID of the resource backing this item — the web clip ID for
        `web_clip`, or the feed entry ID for `feed_entry`. Use this to navigate
        directly to the appropriate reader.
      type: integer
    kind:
      description: The kind of the reading list item.
      type: string
      enum: [web_clip, feed_entry]
    title:
      type: string
    description:
      type: string
    saved_at:
      type: string
      format: date-time

Story:
  type: object
  required: [id, resource_id, kind, title]
  properties:
    id:
      type: integer
    resource_id:
      description:
        The ID of the resource backing this story. Use this to navigate directly
        to the appropriate reader.
      type: integer
    kind:
      description: The kind of the resource backing this story.
      type: string
      enum: [web_clip, feed_entry]
    title:
      type: string
    description:
      type: string
    source:
      type: string
    published_at:
      type: string
      format: date-time
    read_later:
      allOf:
        - $ref: "#/ReadLater"
      description:
        The reading list item backing this story, if it is saved in the reading
        list. Absent when the story is not saved.

Error:
  type: object
  required: [message]
  properties:
    message:
      type: string

AuthToken:
  type: object
  required: [token]
  properties:
    token:
      description:
        Opaque bearer token to send in the `Authorization` header on subsequent
        requests.
      type: string

SignUpTicket:
  type: object
  required: [ticket]
  properties:
    ticket:
      description:
        Opaque secret identifying the sign-up attempt the verification code was
        mailed for. Send it back to verify the address or to request another
        code. Valid for 10 minutes.
      type: string

SemanticTree:
  description:
    A web page simplified into a semantic tree, on which post matchers run. See
    SemanticTree in `server/feature/feed/semantic_tree.go` for the format.
  type: object
  required: [url, title, root]
  properties:
    url:
      type: string
      format: uri
    title:
      type: string
    root:
      $ref: "#/SemanticTreeNode"

SemanticTreeNode:
  description:
    A value, which has no children, or a container, which has children.
  type: object
  properties:
    tag:
      description:
        The tag name of the element that the node comes from. `img` for an
        image, `time` for a time. Missing for a plain text that does not come
        from one element.
      type: string
    cls:
      description:
        The classes of the element, without generated parts such as hashes.
      type: array
      items:
        type: string
    val:
      description:
        Plain text, the alt text of an image, or the RFC 3339 timestamp of a
        time.
      type: string
    link:
      description: The link target, or the URL of an image.
      type: string
    ch:
      type: array
      items:
        $ref: "#/SemanticTreeNode"

PostMatcher:
  description:
    A rule that finds the posts of one kind in a page and extracts their fields.
    See PostMatcher in `server/feature/feed/post_matcher.go`.
  type: object
  required: [post, fields, exclude]
  properties:
    post:
      description: The chain of steps from the root to the post nodes.
      type: array
      items:
        $ref: "#/Step"
    fields:
      description:
        The chains of steps from a post node to each labeled field, tried in
        order.
      type: object
      properties:
        title:
          type: array
          items:
            type: array
            items:
              $ref: "#/Step"
        body:
          type: array
          items:
            type: array
            items:
              $ref: "#/Step"
        link:
          type: array
          items:
            type: array
            items:
              $ref: "#/Step"
        thumbnail:
          type: array
          items:
            type: array
            items:
              $ref: "#/Step"
        pubDate:
          type: array
          items:
            type: array
            items:
              $ref: "#/Step"
    exclude:
      description: Glob patterns of the links of nodes that are not posts.
      type: array
      items:
        type: string

Step:
  description:
    Selects nodes by their tag and classes, as a step of a CSS descendant
    selector does. A step without a tag selects plain texts.
  type: object
  properties:
    tag:
      type: string
    cls:
      type: array
      items:
        type: string
    nth:
      description:
        The zero-based index in document order of the only selected node.
      type: integer
