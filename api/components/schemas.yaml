Feed:
  type: object
  required: [id, url, title]
  properties:
    id:
      type: integer
    url:
      type: string
      format: uri
    site_url:
      type: string
      format: uri
    icon_url:
      type: string
      format: uri
    title:
      type: string
    description:
      type: string

FeedCandidate:
  description:
    A feed discovered via search that can be subscribed to (has no local ID yet)
  type: object
  required: [url, title]
  properties:
    url:
      type: string
      format: uri
    site_url:
      type: string
      format: uri
    icon_url:
      type: string
      format: uri
    title:
      type: string
    description:
      type: string

FeedEntry:
  type: object
  required: [id, feed_id, url, title, snapshot_at]
  properties:
    id:
      type: integer
    feed_id:
      type: integer
    url:
      type: string
      format: uri
    title:
      type: string
    description:
      type: string
    content:
      type: string
    published_at:
      type: string
      format: date-time
    snapshot_at:
      type: string
      format: date-time
    read_later:
      allOf:
        - $ref: "#/ReadLater"
      description:
        The reading list item backing this entry, if it is saved in the reading
        list. Absent when the entry is not saved.

ReadLater:
  description:
    The reading list item backing a resource. Present only when the resource is
    saved in the reading list; absent otherwise.
  type: object
  required: [id, archived]
  properties:
    id:
      description: The id of the reading list item.
      type: integer
    archived:
      description: Whether the reading list item is archived.
      type: boolean

ReadingListItem:
  type: object
  required: [id, resource_id, kind, title, saved_at]
  properties:
    id:
      type: integer
    resource_id:
      description:
        The ID of the resource backing this item — the web clip ID for
        `web_clip`, or the feed entry ID for `feed_entry`. Use this to navigate
        directly to the appropriate reader.
      type: integer
    kind:
      description: The kind of the reading list item.
      type: string
      enum: [web_clip, feed_entry]
    title:
      type: string
    description:
      type: string
    saved_at:
      type: string
      format: date-time

Story:
  type: object
  required: [id, resource_id, kind, title]
  properties:
    id:
      type: integer
    resource_id:
      description:
        The ID of the resource backing this story. Use this to navigate directly
        to the appropriate reader.
      type: integer
    kind:
      description: The kind of the resource backing this story.
      type: string
      enum: [web_clip, feed_entry]
    title:
      type: string
    description:
      type: string
    source:
      type: string
    published_at:
      type: string
      format: date-time
    read_later:
      allOf:
        - $ref: "#/ReadLater"
      description:
        The reading list item backing this story, if it is saved in the reading
        list. Absent when the story is not saved.

Error:
  type: object
  required: [message]
  properties:
    message:
      type: string

AuthToken:
  type: object
  required: [token]
  properties:
    token:
      description:
        Opaque bearer token to send in the `Authorization` header on subsequent
        requests.
      type: string

SignUpTicket:
  type: object
  required: [ticket]
  properties:
    ticket:
      description:
        Opaque secret identifying the sign-up attempt the verification code was
        mailed for. Send it back to verify the address or to request another
        code. Valid for 10 minutes.
      type: string
