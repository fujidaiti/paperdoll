Feed:
  description:
    A web feed, or an unstructured feed, which is a web page without a feed
    whose posts are extracted with post selectors. The `url` and `site_url` of
    an unstructured feed are both the page's URL.
  type: object
  required: [id, url, title, subscribed, has_selectors]
  properties:
    id:
      type: integer
    url:
      type: string
      format: uri
    site_url:
      type: string
      format: uri
    icon_url:
      type: string
      format: uri
    title:
      type: string
    description:
      type: string
    subscribed:
      description: Whether the calling user is subscribed to this feed.
      type: boolean
    has_selectors:
      description:
        Whether post selectors are saved for this feed. Only an unstructured
        feed can have them.
      type: boolean

FeedCandidate:
  description:
    A feed discovered via search that can be subscribed to (has no local ID yet)
  type: object
  required: [url, title]
  properties:
    url:
      type: string
      format: uri
    site_url:
      type: string
      format: uri
    icon_url:
      type: string
      format: uri
    title:
      type: string
    description:
      type: string

FeedEntry:
  type: object
  required: [id, feed_id, url, title, snapshot_at]
  properties:
    id:
      type: integer
    feed_id:
      type: integer
    url:
      type: string
      format: uri
    title:
      type: string
    description:
      type: string
    content:
      type: string
    published_at:
      type: string
      format: date-time
    snapshot_at:
      type: string
      format: date-time
    read_later:
      allOf:
        - $ref: "#/ReadLater"
      description:
        The reading list item backing this entry, if it is saved in the reading
        list. Absent when the entry is not saved.

ReadLater:
  description:
    The reading list item backing a resource. Present only when the resource is
    saved in the reading list; absent otherwise.
  type: object
  required: [id, archived]
  properties:
    id:
      description: The id of the reading list item.
      type: integer
    archived:
      description: Whether the reading list item is archived.
      type: boolean

ReadingListItem:
  type: object
  required: [id, resource_id, kind, title, saved_at]
  properties:
    id:
      type: integer
    resource_id:
      description:
        The ID of the resource backing this item — the web clip ID for
        `web_clip`, or the feed entry ID for `feed_entry`. Use this to navigate
        directly to the appropriate reader.
      type: integer
    kind:
      description: The kind of the reading list item.
      type: string
      enum: [web_clip, feed_entry]
    title:
      type: string
    description:
      type: string
    saved_at:
      type: string
      format: date-time

Story:
  type: object
  required: [id, resource_id, kind, title]
  properties:
    id:
      type: integer
    resource_id:
      description:
        The ID of the resource backing this story. Use this to navigate directly
        to the appropriate reader.
      type: integer
    kind:
      description: The kind of the resource backing this story.
      type: string
      enum: [web_clip, feed_entry]
    title:
      type: string
    description:
      type: string
    source:
      type: string
    published_at:
      type: string
      format: date-time
    read_later:
      allOf:
        - $ref: "#/ReadLater"
      description:
        The reading list item backing this story, if it is saved in the reading
        list. Absent when the story is not saved.

Error:
  type: object
  required: [message]
  properties:
    message:
      type: string

AuthToken:
  type: object
  required: [token]
  properties:
    token:
      description:
        Opaque bearer token to send in the `Authorization` header on subsequent
        requests.
      type: string

SignUpTicket:
  type: object
  required: [ticket]
  properties:
    ticket:
      description:
        Opaque secret identifying the sign-up attempt the verification code was
        mailed for. Send it back to verify the address or to request another
        code. Valid for 10 minutes.
      type: string

SelectorEditor:
  description:
    A temporary editor of the post selectors of an unstructured feed. See
    SelectorEditor in `server/feature/feed/selector_editor.go`.
  type: object
  required:
    [
      id,
      expires_at,
      page,
      labeled_posts,
      excluded_links,
      matched_posts,
      excluded_posts,
      preview,
    ]
  properties:
    id:
      type: integer
    expires_at:
      type: string
      format: date-time
    page:
      description:
        The page simplified into an HTML document, with the node ID of each
        element in its `data-id` attribute. The node ID of a node is its
        position among the nodes of the page in document order, and a text takes
        the ID of its position too. See SimplifyPage in
        `server/feature/feed/simplify.go` for the format.
      type: string
    labeled_posts:
      description:
        The posts labeled so far. A new editor starts with the posts that the
        saved selectors find.
      type: array
      items:
        $ref: "#/LabeledPost"
    excluded_links:
      description:
        The host and path of each excluded link. A new editor starts with the
        ones of the saved selectors.
      type: array
      items:
        type: string
    matched_posts:
      $ref: "#/SelectorEditorState/properties/matched_posts"
    excluded_posts:
      $ref: "#/SelectorEditorState/properties/excluded_posts"
    preview:
      $ref: "#/SelectorEditorState/properties/preview"

SelectorEditorState:
  description: What the selectors generated from the marks of an editor find.
  type: object
  required: [matched_posts, excluded_posts, preview]
  properties:
    matched_posts:
      description: The posts that the selectors find, in document order.
      type: array
      items:
        $ref: "#/MatchedPost"
    excluded_posts:
      description:
        The nodes that would be posts if their links were not excluded, in
        document order.
      type: array
      items:
        $ref: "#/ExcludedPost"
    preview:
      description:
        The posts extracted from the page, merged by link, as the polling job
        will save them.
      type: array
      items:
        $ref: "#/ExtractedPost"

LabeledPost:
  description:
    A post by node IDs, the post node under `box` and the node of each labeled
    field under the name of the field.
  type: object
  required: [box, title, link]
  properties:
    box:
      type: integer
    title:
      type: integer
    body:
      type: integer
    link:
      type: integer
    thumbnail:
      type: integer
    pubDate:
      type: integer

MatchedPost:
  description:
    A post that the selectors find, by node IDs as in LabeledPost, with the
    value of each field that it has.
  type: object
  required: [box, title, link, values]
  properties:
    box:
      type: integer
    title:
      type: integer
    body:
      type: integer
    link:
      type: integer
    thumbnail:
      type: integer
    pubDate:
      type: integer
    values:
      $ref: "#/ExtractedPost"

ExcludedPost:
  type: object
  required: [box, link]
  properties:
    box:
      type: integer
    link:
      description: The excluded link that excludes the post.
      type: string

ExtractedPost:
  description: The value of each field of a post.
  type: object
  properties:
    title:
      type: string
    body:
      type: string
    link:
      type: string
    thumbnail:
      type: string
    pubDate:
      type: string
