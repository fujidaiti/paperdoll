BadRequest:
  description: Bad request
  content:
    application/json:
      schema:
        $ref: "./schemas.yaml#/Error"
      example:
        message: "Invalid feed id"

Unauthorized:
  description: Unauthorized
  content:
    application/json:
      schema:
        $ref: "./schemas.yaml#/Error"
      example:
        message: "Email or password is incorrect"

NotFound:
  description: Not found
  content:
    application/json:
      schema:
        $ref: "./schemas.yaml#/Error"
      example:
        message: "No feed found"

Conflict:
  description: Conflict
  content:
    application/json:
      schema:
        $ref: "./schemas.yaml#/Error"
      example:
        message: "Email already exists"

InternalServerError:
  description: Internal server error
  content:
    application/json:
      schema:
        $ref: "./schemas.yaml#/Error"
      example:
        message: "Failed to fetch feeds"

TooManyRequests:
  description: Too many requests
  content:
    application/json:
      schema:
        $ref: "./schemas.yaml#/Error"
      example:
        message: "Too many verification emails sent to this address"
