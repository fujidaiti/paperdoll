collection:
  get:
    summary: Get subscribed feeds
    description:
      Returns only the caller's own subscriptions. The `subscribed` is always
      `true`.
    operationId: getFeeds
    tags: [Feeds]
    parameters:
      - name: after
        in: query
        required: false
        description:
          Opaque pagination cursor. Pass the `next_cursor` from the previous
          response to fetch the next page of feeds. Omit for the first page.
        schema:
          type: string
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: object
              required: [feeds]
              properties:
                feeds:
                  type: array
                  items:
                    $ref: "../components/schemas.yaml#/Feed"
                next_cursor:
                  description:
                    Opaque cursor to fetch the next page. Absent when there are
                    no more feeds.
                  type: string
            example:
              feeds:
                - id: 1
                  url: "https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_anthropic_engineering.xml"
                  site_url: "https://www.anthropic.com/engineering"
                  icon_url: "https://www.anthropic.com/images/icons/apple-touch-icon.png"
                  title: "Anthropic Engineering Blog"
                  description: "Inside the team building reliable AI systems"
                  subscribed: true
                  has_selectors: false
                - id: 30
                  url: "https://blog.golang.org/feed.atom"
                  title: "The Go Blog"
                  subscribed: true
                  has_selectors: false
                - id: 29
                  url: "https://dart.dev/blog/feed.xml"
                  site_url: "https://dart.dev/blog"
                  title: "The Dart Blog"
                  description:
                    "Dart is an approachable, portable, and productive language
                    for high-quality apps on any platform."
                  subscribed: true
                  has_selectors: false
      "500":
        $ref: "../components/responses.yaml#/InternalServerError"
  put:
    summary: Subscribe to a feed
    description:
      Creates the caller's subscription. The `url` can be a feed or a web page.
      For a page, the feed is the one that the page links in its head, or the
      page itself as an unstructured feed if it links none. The `subscribed` is
      always `true`. This operation is idempotent, so subscribing to a feed the
      caller is already subscribed to has no additional effect.
    operationId: subscribeToFeed
    tags: [Feeds]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [url]
            properties:
              url:
                type: string
                format: uri
          example:
            url: "https://dart.dev/blog/feed.xml"
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/Feed"
            example:
              id: 29
              url: "https://dart.dev/blog/feed.xml"
              site_url: "https://dart.dev/blog"
              title: "The Dart Blog"
              description:
                "Dart is an approachable, portable, and productive language for
                high-quality apps on any platform."
              subscribed: true
              has_selectors: false
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "500":
        $ref: "../components/responses.yaml#/InternalServerError"

search:
  get:
    summary: Search for subscribable feeds
    description:
      The `q` is the URL of a feed or a web page. For a page, the candidate is
      the feed that the page links in its head, or the page itself as an
      unstructured feed if it links none.
    operationId: searchFeeds
    tags: [Feeds]
    parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
        example: "https://dart.dev/blog/feed.xml"
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: object
              required: [feeds]
              properties:
                feeds:
                  type: array
                  items:
                    $ref: "../components/schemas.yaml#/FeedCandidate"
            example:
              feeds:
                - url: "https://dart.dev/blog/feed.xml"
                  site_url: "https://dart.dev/blog"
                  title: "The Dart Blog"
                  description:
                    "Dart is an approachable, portable, and productive language
                    for high-quality apps on any platform."
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "500":
        $ref: "../components/responses.yaml#/InternalServerError"

item:
  get:
    summary: Get a feed by ID
    description:
      Does not require a subscription. `subscribed` reports whether the caller
      is subscribed, so this is the only operation that can report `false`.
    operationId: getFeed
    tags: [Feeds]
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/Feed"
            example:
              id: 1
              url: "https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_anthropic_engineering.xml"
              site_url: "https://www.anthropic.com/engineering"
              icon_url: "https://www.anthropic.com/images/icons/apple-touch-icon.png"
              title: "Anthropic Engineering Blog"
              description: "Inside the team building reliable AI systems"
              subscribed: true
              has_selectors: false
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "500":
        $ref: "../components/responses.yaml#/InternalServerError"
  delete:
    summary: Unsubscribe from a feed
    description:
      Drops the calling user's subscription. The feed itself is shared across
      all users and is left intact, so its entries remain reachable.
    operationId: unsubscribeFromFeed
    tags: [Feeds]
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    responses:
      "204":
        description: No Content
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "500":
        $ref: "../components/responses.yaml#/InternalServerError"

timeline:
  get:
    summary: Get timeline entries for a feed
    operationId: getFeedTimeline
    tags: [Feeds]
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      - name: after
        in: query
        required: false
        description:
          Opaque pagination cursor. Pass the `next_cursor` from the previous
          response to fetch the next page of entries. Omit for the first page.
        schema:
          type: string
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: object
              required: [entries]
              properties:
                entries:
                  type: array
                  items:
                    $ref: "../components/schemas.yaml#/FeedEntry"
                next_cursor:
                  description:
                    Opaque cursor to fetch the next page. Absent when there are
                    no more entries.
                  type: string
            example:
              entries:
                - id: 10
                  feed_id: 1
                  url: "https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents"
                  title: "Demystifying evals for AI agents"
                  description:
                    "The capabilities that make agents useful also make them
                    difficult to evaluate. The strategies that work across
                    deployments combine techniques to match the complexity of
                    the systems they measure."
                  published_at: "2026-01-09T09:00:00+09:00"
                  snapshot_at: "2026-05-26T02:29:39.785457+09:00"
                - id: 11
                  feed_id: 1
                  url: "https://www.anthropic.com/engineering/effective-harnesses-for-long-running-agents"
                  title: "Effective harnesses for long-running agents"
                  description:
                    "Agents still face challenges working across many context
                    windows. We looked to human engineers for inspiration in
                    creating a more effective harness for long-running agents."
                  published_at: "2025-11-26T09:00:00+09:00"
                  snapshot_at: "2026-05-26T02:29:40.197419+09:00"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "500":
        $ref: "../components/responses.yaml#/InternalServerError"

selector:
  get:
    summary: Get the simplified page and post selectors of an unstructured feed
    description:
      Fetches the page of the feed and returns it as a simplified HTML document,
      together with the saved post selectors. This is the entry point for
      editing the selectors. Selectors are shared by all users, as feeds are.
    operationId: getFeedSelectors
    tags: [Feeds]
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: object
              required: [page]
              properties:
                page:
                  description:
                    The page simplified into an HTML document, on which post
                    selectors run. See SimplifyPage in
                    `server/feature/feed/simplify.go` for the format.
                  type: string
                selectors:
                  description: Absent when no selectors are saved.
                  type: array
                  items:
                    $ref: "../components/schemas.yaml#/PostSelector"
            example:
              page:
                '<!DOCTYPE html><html><head><title>Example Blog</title><link
                rel="canonical"
                href="https://example.com/blog"/></head><body><article
                class="post"><h2 href="https://example.com/blog/first">First
                post</h2><p>The first post.</p></article></body></html>'
              selectors:
                - post: [{ tag: "article", cls: ["post"] }]
                  fields:
                    title: [{ tag: "h2" }]
                    link: [{ tag: "h2" }]
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "500":
        $ref: "../components/responses.yaml#/InternalServerError"
      "502":
        $ref: "../components/responses.yaml#/BadGateway"
  put:
    summary: Save the post selectors of an unstructured feed
    description:
      Replaces the post selectors of the feed. Fails with 409 if the feed is not
      an unstructured feed.
    operationId: saveFeedSelectors
    tags: [Feeds]
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [selectors]
            properties:
              selectors:
                type: array
                minItems: 1
                items:
                  $ref: "../components/schemas.yaml#/PostSelector"
          example:
            selectors:
              - post: [{ tag: "article", cls: ["post"] }]
                fields:
                  title: [{ tag: "h2" }]
                  link: [{ tag: "h2" }]
    responses:
      "204":
        description: No Content
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "500":
        $ref: "../components/responses.yaml#/InternalServerError"
