collection:
  get:
    summary: Get subscribed feeds
    description:
      Returns only the caller's own subscriptions. The `subscribed` is always
      `true`.
    operationId: getFeeds
    tags: [Feeds]
    parameters:
      - name: after
        in: query
        required: false
        description:
          Opaque pagination cursor. Pass the `next_cursor` from the previous
          response to fetch the next page of feeds. Omit for the first page.
        schema:
          type: string
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: object
              required: [feeds]
              properties:
                feeds:
                  type: array
                  items:
                    $ref: "../components/schemas.yaml#/Feed"
                next_cursor:
                  description:
                    Opaque cursor to fetch the next page. Absent when there are
                    no more feeds.
                  type: string
            example:
              feeds:
                - id: 1
                  url: "https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_anthropic_engineering.xml"
                  site_url: "https://www.anthropic.com/engineering"
                  icon_url: "https://www.anthropic.com/images/icons/apple-touch-icon.png"
                  title: "Anthropic Engineering Blog"
                  description: "Inside the team building reliable AI systems"
                  subscribed: true
                  has_selectors: false
                - id: 30
                  url: "https://blog.golang.org/feed.atom"
                  title: "The Go Blog"
                  subscribed: true
                  has_selectors: false
                - id: 29
                  url: "https://dart.dev/blog/feed.xml"
                  site_url: "https://dart.dev/blog"
                  title: "The Dart Blog"
                  description:
                    "Dart is an approachable, portable, and productive language
                    for high-quality apps on any platform."
                  subscribed: true
                  has_selectors: false
      "500":
        $ref: "../components/responses.yaml#/InternalServerError"
  put:
    summary: Subscribe to a feed
    description:
      Creates the caller's subscription. The `url` can be a feed or a web page.
      For a page, the feed is the one that the page links in its head, or the
      page itself as an unstructured feed if it links none. The `subscribed` is
      always `true`. This operation is idempotent, so subscribing to a feed the
      caller is already subscribed to has no additional effect.
    operationId: subscribeToFeed
    tags: [Feeds]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [url]
            properties:
              url:
                type: string
                format: uri
          example:
            url: "https://dart.dev/blog/feed.xml"
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/Feed"
            example:
              id: 29
              url: "https://dart.dev/blog/feed.xml"
              site_url: "https://dart.dev/blog"
              title: "The Dart Blog"
              description:
                "Dart is an approachable, portable, and productive language for
                high-quality apps on any platform."
              subscribed: true
              has_selectors: false
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "500":
        $ref: "../components/responses.yaml#/InternalServerError"

search:
  get:
    summary: Search for subscribable feeds
    description:
      The `q` is the URL of a feed or a web page. For a page, the candidate is
      the feed that the page links in its head, or the page itself as an
      unstructured feed if it links none.
    operationId: searchFeeds
    tags: [Feeds]
    parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
        example: "https://dart.dev/blog/feed.xml"
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: object
              required: [feeds]
              properties:
                feeds:
                  type: array
                  items:
                    $ref: "../components/schemas.yaml#/FeedCandidate"
            example:
              feeds:
                - url: "https://dart.dev/blog/feed.xml"
                  site_url: "https://dart.dev/blog"
                  title: "The Dart Blog"
                  description:
                    "Dart is an approachable, portable, and productive language
                    for high-quality apps on any platform."
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "500":
        $ref: "../components/responses.yaml#/InternalServerError"

item:
  get:
    summary: Get a feed by ID
    description:
      Does not require a subscription. `subscribed` reports whether the caller
      is subscribed, so this is the only operation that can report `false`.
    operationId: getFeed
    tags: [Feeds]
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/Feed"
            example:
              id: 1
              url: "https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_anthropic_engineering.xml"
              site_url: "https://www.anthropic.com/engineering"
              icon_url: "https://www.anthropic.com/images/icons/apple-touch-icon.png"
              title: "Anthropic Engineering Blog"
              description: "Inside the team building reliable AI systems"
              subscribed: true
              has_selectors: false
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "500":
        $ref: "../components/responses.yaml#/InternalServerError"
  delete:
    summary: Unsubscribe from a feed
    description:
      Drops the calling user's subscription. The feed itself is shared across
      all users and is left intact, so its entries remain reachable.
    operationId: unsubscribeFromFeed
    tags: [Feeds]
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    responses:
      "204":
        description: No Content
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "500":
        $ref: "../components/responses.yaml#/InternalServerError"

timeline:
  get:
    summary: Get timeline entries for a feed
    operationId: getFeedTimeline
    tags: [Feeds]
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      - name: after
        in: query
        required: false
        description:
          Opaque pagination cursor. Pass the `next_cursor` from the previous
          response to fetch the next page of entries. Omit for the first page.
        schema:
          type: string
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: object
              required: [entries]
              properties:
                entries:
                  type: array
                  items:
                    $ref: "../components/schemas.yaml#/FeedEntry"
                next_cursor:
                  description:
                    Opaque cursor to fetch the next page. Absent when there are
                    no more entries.
                  type: string
            example:
              entries:
                - id: 10
                  feed_id: 1
                  url: "https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents"
                  title: "Demystifying evals for AI agents"
                  description:
                    "The capabilities that make agents useful also make them
                    difficult to evaluate. The strategies that work across
                    deployments combine techniques to match the complexity of
                    the systems they measure."
                  published_at: "2026-01-09T09:00:00+09:00"
                  snapshot_at: "2026-05-26T02:29:39.785457+09:00"
                - id: 11
                  feed_id: 1
                  url: "https://www.anthropic.com/engineering/effective-harnesses-for-long-running-agents"
                  title: "Effective harnesses for long-running agents"
                  description:
                    "Agents still face challenges working across many context
                    windows. We looked to human engineers for inspiration in
                    creating a more effective harness for long-running agents."
                  published_at: "2025-11-26T09:00:00+09:00"
                  snapshot_at: "2026-05-26T02:29:40.197419+09:00"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "500":
        $ref: "../components/responses.yaml#/InternalServerError"

selectorEditors:
  post:
    summary: Open a new selector editor
    description:
      Opens a new editor of the post selectors of an unstructured feed for the
      caller, with the current page of the feed. The editor starts with the
      marks of the saved selectors, which are the posts that they find and the
      links that they exclude. The editor is available until `expires_at`. Fails
      with 409 if the feed is not an unstructured feed, and with 502 if the page
      cannot be fetched.
    operationId: openSelectorEditor
    tags: [Feeds]
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    responses:
      "201":
        description: Created
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/SelectorEditor"
            example:
              id: 42
              expires_at: "2026-11-04T10:00:00Z"
              page:
                '<!DOCTYPE html><html><head><title>Example
                Blog</title></head><body data-id="0"><article data-id="1"
                class="post"><h2 data-id="2"
                href="https://blog.example.com/first">First
                post</h2></article></body></html>'
              labeled_posts: [{ box: 1, title: 2, link: 2 }]
              excluded_links: []
              matched_posts:
                - box: 1
                  title: 2
                  link: 2
                  values:
                    title: "First post"
                    link: "https://blog.example.com/first"
              excluded_posts: []
              preview:
                - title: "First post"
                  link: "https://blog.example.com/first"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "500":
        $ref: "../components/responses.yaml#/InternalServerError"
      "502":
        $ref: "../components/responses.yaml#/BadGateway"

selectorEditor:
  get:
    summary: Get a selector editor
    description:
      Returns a selector editor of the caller with its latest marks. The page is
      the one from when the editor was opened. Getting the editor does not
      extend `expires_at`. Fails with 410 if the editor has expired.
    operationId: getSelectorEditor
    tags: [Feeds]
    parameters:
      - $ref: "#/parameters/feedId"
      - $ref: "#/parameters/editorId"
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/SelectorEditor"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "410":
        $ref: "../components/responses.yaml#/Gone"
      "500":
        $ref: "../components/responses.yaml#/InternalServerError"
  delete:
    summary: Close a selector editor
    description:
      Closes a selector editor of the caller and discards its marks. The saved
      selectors of the feed do not change.
    operationId: closeSelectorEditor
    tags: [Feeds]
    parameters:
      - $ref: "#/parameters/feedId"
      - $ref: "#/parameters/editorId"
    responses:
      "204":
        description: No Content
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "500":
        $ref: "../components/responses.yaml#/InternalServerError"

selectorEditorMarks:
  put:
    summary: Update the marks of a selector editor
    description:
      Replaces all marks of the editor, and returns the posts that the editor
      finds with the new marks. The saved selectors of the feed do not change
      until the editor is committed. Fails with 400 if a mark refers to a node
      that is not on the page of the editor, and with 410 if the editor has
      expired.
    operationId: updateSelectorEditorMarks
    tags: [Feeds]
    parameters:
      - $ref: "#/parameters/feedId"
      - $ref: "#/parameters/editorId"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [labeled_posts, excluded_links]
            properties:
              labeled_posts:
                type: array
                items:
                  $ref: "../components/schemas.yaml#/LabeledPost"
              excluded_links:
                description: The host and path of each excluded link.
                type: array
                items:
                  type: string
          example:
            labeled_posts: [{ box: 1, title: 2, link: 2 }]
            excluded_links: ["blog.example.com/newsletters"]
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/SelectorEditorState"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "410":
        $ref: "../components/responses.yaml#/Gone"
      "500":
        $ref: "../components/responses.yaml#/InternalServerError"

selectorEditorCommit:
  post:
    summary: Commit a selector editor
    description:
      Saves the selectors of the editor to the feed, replacing the saved ones,
      and closes the editor. Selectors are shared by all users, as feeds are,
      and the last commit wins. Fails with 409 if the marks of the editor find
      no posts, and with 410 if the editor has expired.
    operationId: commitSelectorEditor
    tags: [Feeds]
    parameters:
      - $ref: "#/parameters/feedId"
      - $ref: "#/parameters/editorId"
    responses:
      "204":
        description: No Content
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "410":
        $ref: "../components/responses.yaml#/Gone"
      "500":
        $ref: "../components/responses.yaml#/InternalServerError"

parameters:
  feedId:
    name: id
    in: path
    required: true
    schema:
      type: integer
  editorId:
    name: eid
    in: path
    required: true
    schema:
      type: integer
