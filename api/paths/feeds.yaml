collection:
  get:
    summary: Get subscribed feeds
    operationId: getFeeds
    tags: [Feeds]
    parameters:
      - name: after
        in: query
        required: false
        description:
          Opaque pagination cursor. Pass the `next_cursor` from the previous
          response to fetch the next page of feeds. Omit for the first page.
        schema:
          type: string
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: object
              required: [feeds]
              properties:
                feeds:
                  type: array
                  items:
                    $ref: "../components/schemas.yaml#/Feed"
                next_cursor:
                  description:
                    Opaque cursor to fetch the next page. Absent when there are
                    no more feeds.
                  type: string
            example:
              feeds:
                - id: 1
                  url: "https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_anthropic_engineering.xml"
                  site_url: "https://www.anthropic.com/engineering"
                  icon_url: "https://www.anthropic.com/images/icons/apple-touch-icon.png"
                  title: "Anthropic Engineering Blog"
                  description: "Inside the team building reliable AI systems"
                - id: 30
                  url: "https://blog.golang.org/feed.atom"
                  title: "The Go Blog"
                - id: 29
                  url: "https://dart.dev/blog/feed.xml"
                  site_url: "https://dart.dev/blog"
                  title: "The Dart Blog"
                  description:
                    "Dart is an approachable, portable, and productive language
                    for high-quality apps on any platform."
      "500":
        $ref: "../components/responses.yaml#/InternalServerError"
  put:
    summary: Subscribe to a feed
    operationId: subscribeToFeed
    tags: [Feeds]
    description:
      Subscribes to `url`. For an RSS/Atom feed, or for an HTML page that links
      to one, send the URL alone. For an HTML page with no feed, send the
      `selectors` the user built from the `post_groups` of `GET /feeds/search`.
      The server fetches the page again and rejects the request with 400 when a
      `root` matches no element, or when a `link` matches nothing in any item,
      because such a subscription would stay empty forever. When the selectors
      do produce posts, they are stored as feed entries right away, so `GET
      /feeds/{id}/timeline` answers without waiting for the next poll.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [url]
            properties:
              url:
                type: string
                format: uri
              selectors:
                description:
                  How to read posts out of an HTML page. Omit it when `url`
                  points at an RSS/Atom feed or at a page that links to one.
                  Several entries are allowed, one per group the user ticked;
                  posts are deduplicated by URL across them.
                type: array
                items:
                  $ref: "../components/schemas.yaml#/PostSelectors"
          example:
            url: "https://dart.dev/blog/feed.xml"
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/Feed"
            example:
              id: 29
              url: "https://dart.dev/blog/feed.xml"
              site_url: "https://dart.dev/blog"
              title: "The Dart Blog"
              description:
                "Dart is an approachable, portable, and productive language for
                high-quality apps on any platform."
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "500":
        $ref: "../components/responses.yaml#/InternalServerError"

search:
  get:
    summary: Search for subscribable feeds
    operationId: searchFeeds
    tags: [Feeds]
    description:
      Looks up `q` as a feed URL or as the URL of a web page. When the page is
      an RSS/Atom feed, or links to one, the candidate carries no `post_groups`
      and the client subscribes with the URL alone. Otherwise the server
      enumerates the lists of post-like elements in the page and returns them as
      `post_groups`, for the user to resolve on the subscription screen.
    parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
        example: "https://dart.dev/blog/feed.xml"
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: object
              required: [feeds]
              properties:
                feeds:
                  type: array
                  items:
                    $ref: "../components/schemas.yaml#/FeedCandidate"
            example:
              feeds:
                - url: "https://claude.com/blog"
                  site_url: "https://claude.com/blog"
                  title: "Blog | Claude by Anthropic"
                  post_groups:
                    - id: 0
                      selector: "html > body > main > div:nth-of-type(2) > a"
                      count: 24
                      sampled: 2
                      links:
                        - selector: ":scope"
                          matched: 24
                          values:
                            - value: "https://claude.com/blog/cowork-and-chat"
                            - value: "https://claude.com/blog/claude-in-chrome"
                      texts:
                        - selector: "div > h3"
                          matched: 24
                          values:
                            - value: "Claude Cowork and chat are now one Claude"
                            - value: "Claude in Chrome is generally available"
                        - selector: "div > time"
                          matched: 23
                          values:
                            - value: "September 16, 2026"
                            - value: "Aug 10, 2026"
                      images:
                        - selector: "div > img"
                          matched: 24
                          values:
                            - value: "https://claude.com/images/cowork.png"
                              alt: "Claude Cowork"
                            - value: "https://claude.com/images/chrome.png"
                              alt: "Claude in Chrome"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "500":
        $ref: "../components/responses.yaml#/InternalServerError"

item:
  get:
    summary: Get a feed by ID
    operationId: getFeed
    tags: [Feeds]
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/Feed"
            example:
              id: 1
              url: "https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_anthropic_engineering.xml"
              site_url: "https://www.anthropic.com/engineering"
              icon_url: "https://www.anthropic.com/images/icons/apple-touch-icon.png"
              title: "Anthropic Engineering Blog"
              description: "Inside the team building reliable AI systems"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "500":
        $ref: "../components/responses.yaml#/InternalServerError"

timeline:
  get:
    summary: Get timeline entries for a feed
    operationId: getFeedTimeline
    tags: [Feeds]
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      - name: after
        in: query
        required: false
        description:
          Opaque pagination cursor. Pass the `next_cursor` from the previous
          response to fetch the next page of entries. Omit for the first page.
        schema:
          type: string
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: object
              required: [entries]
              properties:
                entries:
                  type: array
                  items:
                    $ref: "../components/schemas.yaml#/FeedEntry"
                next_cursor:
                  description:
                    Opaque cursor to fetch the next page. Absent when there are
                    no more entries.
                  type: string
            example:
              entries:
                - id: 10
                  feed_id: 1
                  url: "https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents"
                  title: "Demystifying evals for AI agents"
                  description:
                    "The capabilities that make agents useful also make them
                    difficult to evaluate. The strategies that work across
                    deployments combine techniques to match the complexity of
                    the systems they measure."
                  published_at: "2026-01-09T09:00:00+09:00"
                  snapshot_at: "2026-05-26T02:29:39.785457+09:00"
                - id: 11
                  feed_id: 1
                  url: "https://www.anthropic.com/engineering/effective-harnesses-for-long-running-agents"
                  title: "Effective harnesses for long-running agents"
                  description:
                    "Agents still face challenges working across many context
                    windows. We looked to human engineers for inspiration in
                    creating a more effective harness for long-running agents."
                  published_at: "2025-11-26T09:00:00+09:00"
                  snapshot_at: "2026-05-26T02:29:40.197419+09:00"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "500":
        $ref: "../components/responses.yaml#/InternalServerError"
