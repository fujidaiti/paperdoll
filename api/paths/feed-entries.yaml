get:
  summary: Get a feed entry by ID
  operationId: getFeedEntry
  tags: [Feeds]
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: "../components/schemas.yaml#/FeedEntry"
          example:
            id: 10
            feed_id: 1
            url: "https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents"
            title: "Demystifying evals for AI agents"
            description:
              "The capabilities that make agents useful also make them difficult
              to evaluate. The strategies that work across deployments combine
              techniques to match the complexity of the systems they measure."
            content:
              "<article><h2>Introduction</h2><p>Good evaluations help teams ship
              AI agents more confidently...</p></article>"
            published_at: "2026-01-09T09:00:00+09:00"
            snapshot_at: "2026-05-26T02:29:39.785457+09:00"
    "400":
      $ref: "../components/responses.yaml#/BadRequest"
    "404":
      $ref: "../components/responses.yaml#/NotFound"
    "500":
      $ref: "../components/responses.yaml#/InternalServerError"
