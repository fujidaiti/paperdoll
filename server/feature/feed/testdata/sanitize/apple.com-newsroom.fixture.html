<html
  xmlns="http://www.w3.org/1999/xhtml"
  xml:lang="en-US"
  lang="en-US"
  dir="ltr"
  prefix="og: http://ogp.me/ns#"
  class="no-js globalheader-dark"
>
  <body class="page-landing">
    <meta name="globalnav-store-key" content="SFX9YPYY9PPXCU9KH" />
    <meta name="globalnav-submenus-enabled" content="false" />

    <div id="globalheader">
      <aside
        id="globalmessage-segment"
        lang="en-US"
        dir="ltr"
        class="globalmessage-segment"
      >
        <ul
          data-strings="{&#34;view&#34;:&#34;{%STOREFRONT%} Store Home&#34;,&#34;segments&#34;:{&#34;smb&#34;:&#34;Business Store Home&#34;,&#34;eduInd&#34;:&#34;Education Store Home&#34;,&#34;other&#34;:&#34;Store Home&#34;},&#34;exit&#34;:&#34;Exit&#34;}"
          class="globalmessage-segment-content"
        ></ul>
      </aside>

      <div id="globalnav-curtain" class="globalnav-curtain"></div>
      <div id="globalnav-placeholder" class="globalnav-placeholder"></div>
    </div>

    <div id="search-curtain" class="search-curtain"></div>

    <span id="opens-in-new-window" class="large-hide">opens in new window</span>
    <main id="main" class="main" role="main" data-page-type="landing">
      <h1 class="visuallyhidden">Newsroom</h1>

      <div class="module-wrapper">
        <div class="module-trigger" id="everydayfeed-trigger"></div>
        <section
          id="everydayfeed"
          class="everydayfeed"
          data-analytics-section-engagement="name:everyday"
          data-anim-scroll-group="everyday"
        >
          <div class="slideshow__loader"></div>
        </section>
      </div>

      <div class="module-wrapper">
        <div class="module-trigger" id="in-the-loop-gallery-trigger"></div>
        <section
          id="in-the-loop-gallery"
          class="in-the-loop-gallery"
          data-analytics-activitymap-region-id="in-the-loop-gallery"
          data-analytics-section-engagement="name:in the loop"
        >
          <div class="slideshow__loader"></div>
        </section>
      </div>

      <div class="module-wrapper">
        <div class="module-trigger" id="stories-module-trigger"></div>
        <section
          id="stories-module"
          class="stories-module"
          data-analytics-section-engagement="name:apple stories"
        >
          <div class="slideshow__loader"></div>
        </section>
      </div>

      <div class="module-wrapper">
        <div class="module-trigger" id="more-from-newsroom-trigger"></div>
        <section
          id="more-from-newsroom"
          class="more-from-newsroom"
          data-analytics-section-engagement="name:more-from-apple-newsroom"
          data-anim-scroll-group="more-from-newsroom"
        >
          <div class="slideshow__loader"></div>
        </section>
      </div>

      <div class="webpush-notification-parent">
        <div class="webpush-notification__container display-none">
          <div class="webpush-content webpush__copy">
            Stay up to date with the latest articles from Apple Newsroom.
          </div>
          <div class="webpush-content webpush__button--container"></div>
        </div>
      </div>
    </main>
  </body>
</html>
