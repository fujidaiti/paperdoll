<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>JSON-LD Article | Example Site</title>
    <meta property="og:title" content="JSON-LD Article | Example Site">
    <meta property="og:description" content="The description from og:description.">
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "BlogPosting",
        "headline": "The headline from JSON-LD",
        "description": "The description from JSON-LD."
    }
    </script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
