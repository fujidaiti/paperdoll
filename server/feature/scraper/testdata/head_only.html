<!DOCTYPE html>
<!--
  A page rendered by JavaScript: the metadata is in <head>, but <body> has no
  readable content.
-->
<html>
  <head>
    <meta charset="utf-8">
    <title>Head Only Article | Example Site</title>
    <meta property="og:title" content="Head Only Article">
    <meta property="og:description" content="The description from og:description.">
    <meta name="description" content="The description from the description meta tag.">
  </head>
  <body>
    <div id="root"></div>
    <script src="/app.js"></script>
  </body>
</html>
