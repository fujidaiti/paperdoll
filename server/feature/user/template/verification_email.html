<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your verification code</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f4f4f7">
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="border-collapse: collapse"
    >
      <tr>
        <td align="center" style="padding: 32px 16px">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="
              max-width: 480px;
              border-collapse: collapse;
              background-color: #ffffff;
              border-radius: 8px;
            "
          >
            <tr>
              <td
                style="
                  padding: 32px;
                  font-family:
                    -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial,
                    sans-serif;
                  font-size: 16px;
                  line-height: 24px;
                  color: #1f2933;
                "
              >
                <p style="margin: 0 0 24px">
                  Enter this code to finish creating your account:
                </p>
                <p
                  style="
                    margin: 0 0 24px;
                    font-family:
                      &quot;SF Mono&quot;, Menlo, Consolas, monospace;
                    font-size: 32px;
                    line-height: 40px;
                    font-weight: bold;
                    letter-spacing: 8px;
                    color: #1f2933;
                  "
                >
                  {{.Code}}
                </p>
                <p style="margin: 0; font-size: 14px; color: #616e7c">
                  The code expires in {{.ExpiresInMinutes}} minutes. If you did
                  not request it, ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
