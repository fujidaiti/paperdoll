name: Health

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter SDK
        uses: ./.github/actions/setup-flutter

      - name: Verify generated code
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code

      - name: Format
        run: dart format . -o none --set-exit-if-changed

      - name: Analyze
        run: flutter analyze

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          install-only: true

      - name: Check server formatting
        run: |
          golangci-lint fmt ./...
          git diff --exit-code

      - name: Lint server
        run: golangci-lint run ./...

      - name: Set up Node.js tooling
        uses: ./.github/actions/setup-node-tools

      - name: Prettier
        run: npx prettier --check "**/*.{json,yaml,yml,md}"

      - name: Validate API spec
        run: npx redocly lint api/api.yaml

  client_test:
    name: Client Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter SDK
        uses: ./.github/actions/setup-flutter

      - name: Test client
        working-directory: client
        run: flutter test

  server_test:
    name: Server Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test server
        run: go test ./...

  server_integration_test:
    name: Server Integration Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Integration test server
        run: go test -tags="integration" ./server/itest/... -v
